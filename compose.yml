name: region-comparison
services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: region_comparison
      POSTGRES_USER: region
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-region_demo_local_only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - region_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U region -d region_comparison"]
      interval: 5s
      timeout: 5s
      retries: 20
  initialize:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://region:${POSTGRES_PASSWORD:-region_demo_local_only}@db:5432/region_comparison
    command: ["python", "-m", "region_comparison", "load"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      REGION_DATA_MODE: postgres
      DATABASE_URL: postgresql+psycopg://region:${POSTGRES_PASSWORD:-region_demo_local_only}@db:5432/region_comparison
    ports:
      - "127.0.0.1:${APP_PORT:-8602}:8501"
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  region_pgdata:
