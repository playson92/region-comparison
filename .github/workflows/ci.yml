name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Offline / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python -m ruff check .
          python -m ruff format --check .
          python -m region_comparison doctor
          python -m region_comparison validate
          python scripts/check-output-policy.py
          python -m pytest -m 'not postgres and not live' --junitxml output/codex_runs/ci-${{ github.run_id }}/logs/offline.xml
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1 -Python python
          ./scripts/check.ps1
          & ./.venv/Scripts/python.exe -m region_comparison doctor
          if ($LASTEXITCODE -ne 0) { throw 'Doctor failed' }
      - name: Secret scan of tracked code and data
        shell: python
        run: |
          import pathlib, re, subprocess
          patterns = [r'gh[pousr]_[A-Za-z0-9]{30,}', r'AKIA[0-9A-Z]{16}', r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----']
          for filename in subprocess.check_output(['git','ls-files'], text=True).splitlines():
              path = pathlib.Path(filename)
              if path.suffix in {'.png', '.zip'}: continue
              content = path.read_text(encoding='utf-8-sig')
              assert not any(re.search(p, content) for p in patterns), filename
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_PASSWORD: region_ci_test_only
          POSTGRES_USER: region
          POSTGRES_DB: region_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U region -d region_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://region:region_ci_test_only@localhost:5432/region_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pytest -m postgres --junitxml output/codex_runs/ci-${{ github.run_id }}/logs/postgres.xml
  docker:
    name: Docker full pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          mkdir -p output
          echo "REGION_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "REGION_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose -p regioncomparison-ci up -d --build --wait --wait-timeout 180
      - name: PostgreSQL-backed application, writable output and volume lifecycle
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:8602/_stcore/health
          docker compose -p regioncomparison-ci exec -T app python -m region_comparison doctor --require-database
          docker compose -p regioncomparison-ci exec -T app python -m region_comparison report
          docker compose -p regioncomparison-ci exec -T app python scripts/verify-docker-lifecycle.py activate-newer
          docker compose -p regioncomparison-ci down
          docker compose -p regioncomparison-ci up -d --wait --wait-timeout 180
          docker compose -p regioncomparison-ci exec -T app python scripts/verify-docker-lifecycle.py assert-preserved
          docker compose -p regioncomparison-ci exec -T app python scripts/verify-docker-lifecycle.py activate-seed
      - if: failure()
        run: docker compose -p regioncomparison-ci logs --no-color --tail 120
      - if: always()
        run: docker compose -p regioncomparison-ci down
